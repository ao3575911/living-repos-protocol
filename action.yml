name: Validate Living Repository manifest
description: Validate .living/manifest.yaml files against the Living Repositories Protocol schema.
branding:
  icon: check-circle
  color: green
inputs:
  manifests:
    description: Space-separated paths or glob patterns of manifests to validate.
    default: .living/manifest.yaml
  strict:
    description: "true to fail on unknown fields and values outside the allowed sets. Default false: these are warnings."
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet -r "$GITHUB_ACTION_PATH/requirements-ci.txt"
    - shell: bash
      env:
        MANIFESTS: ${{ inputs.manifests }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -f
        flag=""
        if [ "$STRICT" = "true" ]; then flag="--strict"; fi
        python "$GITHUB_ACTION_PATH/scripts/validate.py" $flag $MANIFESTS
