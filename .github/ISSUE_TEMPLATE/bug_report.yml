name: Bug report
description: Something does not work as documented.
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, expected result and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: manifest
    attributes:
      label: Manifest
      description: The manifest involved, if any. Remove anything private.
      render: yaml
