name: Feature request
description: Propose a change or addition.
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current state falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
