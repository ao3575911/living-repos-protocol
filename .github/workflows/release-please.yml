# Proposes the next SemVer version from Conventional Commit titles.
# Opens a release PR only; it never tags or publishes. CHANGELOG.md stays
# hand-written (Keep a Changelog), and maintainers create the tag and
# release after the PR merges through the normal ruleset.
name: Release Please
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
