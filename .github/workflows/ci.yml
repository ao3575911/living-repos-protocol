name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
      - name: Check links (offline, relative links and anchors)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python scripts/gen_readme.py --check
      - run: test -f schemas/manifest.schema.json
      - run: python scripts/validate.py
      - name: Action self-test
        uses: ./
        with:
          manifests: "examples/*.yaml tests/valid/*.yaml"
          strict: "true"
      - name: Action self-test, lenient mode accepts v0.1.0 manifests
        uses: ./
        with:
          manifests: "tests/compat/*.yaml"
