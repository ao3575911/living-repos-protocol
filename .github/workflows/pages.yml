name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6.0.0
      - name: Stage site
        run: |
          mkdir -p _site_src
          cp -r docs/. _site_src/
          if [ -d schemas ]; then cp -r schemas _site_src/schemas; fi
          # Frozen copy of the schemas at every release tag: /schemas/<tag>/
          for tag in $(git tag --list 'v*'); do
            if git cat-file -e "$tag:schemas" 2>/dev/null; then
              mkdir -p "_site_src/schemas/$tag"
              git archive "$tag" schemas | tar -x -C "_site_src/schemas/$tag" --strip-components=1
            fi
          done
          if [ -d examples ]; then cp -r examples _site_src/examples; fi
      - uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./_site_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5.0.0
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
